# Configuration Emerald
# Brain centralisé pour les bots Protocol Luna
# Les bots (Jade, Pixieglow) se connectent en WebSocket :3126
# et reçoivent des commandes "respond", "react", "typing", "set_presence", "spontaneous"

port: 3126

# --- LLM (Sapphire) ---
sapphire_host: "127.0.0.1"
sapphire_port: 3123
sapphire_bot_username: "User"

# --- Triggers ---
names:
  - "Luna"
  - "Pixie"

keywords:
  - "hello"
  - "hi"
  - "hey"
  - "yo"
  - "help"
  - "question"
  - "ai"
  - "llm"
  - "bot"

random_chance: 0.015
cooldown_seconds: 8
reply_in_dm: true

# --- Delais et comportement par type de trigger ---
concentration:
  mention:
    delay_min: 300
    delay_max: 1500
    ignore_chance: 0.02
    reaction_chance: 0.08
  dm:
    delay_min: 400
    delay_max: 1800
    ignore_chance: 0
    reaction_chance: 0.05
  name:
    delay_min: 800
    delay_max: 4000
    ignore_chance: 0.02
    reaction_chance: 0.06
  keyword:
    delay_min: 1000
    delay_max: 3500
    ignore_chance: 0.02
    reaction_chance: 0.04
  follow-up:
    delay_min: 500
    delay_max: 2000
    ignore_chance: 0.02
    reaction_chance: 0.03
  random:
    delay_min: 1500
    delay_max: 5000
    ignore_chance: 0.02
    reaction_chance: 0.02

reactions:
  - "👀"
  - "😄"
  - "🤔"
  - "👋"
  - "🔥"
  - "💀"
  - "✨"
  - "😭"
  - "🤨"
  - "👌"
  - "🙏"
  - "💅"
  - "🗿"
  - "🌚"

# --- Spontané ---
spontaneous_interval_ms: 300000
spontaneous_chance: 0.12
spontaneous_channel_window_ms: 600000
spontaneous_whitelist: "*"

# --- Burst ---
burst_chance: 0.15
burst_delay_min: 1500
burst_delay_max: 4000

# --- Hésitation ---
hesitation_chance: 0.15
hesitation_words:
  - "uh..."
  - "um..."
  - "well..."
  - "i mean..."
  - "hmm..."
  - "so..."

# --- Oubli ---
forget_chance: 0.03

# --- Fatigue thématique ---
topic_fatigue_enabled: true
topic_fatigue_window: 10
topic_fatigue_threshold: 3
topic_fatigue_delay_multiplier: 2
topic_fatigue_ignore_bonus: 0.15

# --- Voix ---
voice_message_chance: 0.12

# --- Typos ---
typo_chance: 0.06
typo_layout: "azerty"
typo_correction_delay_min: 2000
typo_correction_delay_max: 4000
typo_correction_style: "mixed"

letter_swap_chance: 0.04

# --- Inactivité ---
inactivity_warmup_minutes: 10
inactivity_warmup_multiplier: 2

# --- Horaires ---
timezone: "Europe/Paris"
time_schedules:
  - start: "07:00"
    end: "10:00"
  - start: "10:00"
    end: "11:00"
    behavior: "short"
  - start: "11:00"
    end: "16:00"
  - start: "16:00"
    end: "18:00"
    behavior: "slow"
  - start: "18:00"
    end: "22:00"
  - start: "22:00"
    end: "07:00"
    behavior: "sleep"

# --- Sessions ---
session_message_limit: 8
session_pause_seconds: 30
session_reset_minutes: 3

# --- Styles de réponse ---
reply_styles:
  - message_reference: true
    mention_replied_user: false
    weight: 50
  - message_reference: true
    mention_replied_user: true
    weight: 15
  - message_reference: false
    mention_replied_user: false
    weight: 30
  - message_reference: false
    mention_replied_user: true
    weight: 5

# --- Follow-up ---
follow_up_window: 60000
follow_up_max: 3

# --- Pruning ---
activity_prune_interval: 300000
activity_max_age: 3600000
